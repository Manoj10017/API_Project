
name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: Choose test suite
        required: true
        type: choice
        options:
          - sanity
          - regression
          - API
          - web
          - all
        default: all
      browser:
        description: Choose browser
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium
      headed:
        description: Run browser in headed mode
        required: true
        type: boolean
        default: false

  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run selected Playwright tests
        shell: pwsh
        env:
          TEST_TYPE: ${{ inputs.test_type || 'all' }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          HEADED: ${{ inputs.headed || false }}
        run: |
          $argsList = @()

          switch ($env:TEST_TYPE) {
            'sanity'     { $argsList += @('--grep', '@sanity') }
            'regression' { $argsList += @('--grep', '@regression') }
            'API'        { $argsList += @('--grep', '@API') }
            'web'        { $argsList += @('--grep', '@web') }
            'all'        { }
            default      { throw "Invalid test type: $env:TEST_TYPE" }
          }

          $argsList += @('--project', $env:BROWSER)

          if ($env:HEADED -eq 'true') {
            $argsList += '--headed'
          }

          npx playwright test @argsList

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate Allure HTML report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path "allure-results")) {
            Write-Error "allure-results folder not found. Check your Playwright reporter configuration."
            exit 1
          }

          npx allure generate allure-results --clean -o allure-report

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (!(Test-Path "allure-report/index.html")) {
            Write-Error "Allure HTML report was not generated."
            exit 1
          }

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload raw Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore
