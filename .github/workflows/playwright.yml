
name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: Choose test suite
        required: true
        type: choice
        options:
          - sanity
          - regression
          - API
          - web
          - all
        default: all
      browser:
        description: Choose browser
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium
      headed:
        description: Run browser in headed mode
        required: true
        type: boolean
        default: false

  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run selected Playwright tests
        id: run-tests
        continue-on-error: true
        shell: pwsh
        env:
          TEST_TYPE: ${{ inputs.test_type || 'all' }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          HEADED: ${{ inputs.headed || false }}
        run: |
          $argsList = @()

          switch ($env:TEST_TYPE) {
            'sanity'     { $argsList += @('--grep', '@sanity') }
            'regression' { $argsList += @('--grep', '@regression') }
            'API'        { $argsList += @('--grep', '@API') }
            'web'        { $argsList += @('--grep', '@web') }
            'all'        { }
            default      { throw "Invalid test type: $env:TEST_TYPE" }
          }

          $argsList += @('--project', $env:BROWSER)

          if ($env:HEADED -eq 'true') {
            $argsList += '--headed'
          }

          npx playwright test @argsList

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Get Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report with history
        if: always()
        id: allure-report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Deploy Allure report to GitHub Pages
        if: always() && steps.allure-report.outcome == 'success' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Fail job when Playwright tests fail
        if: always() && steps.run-tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Playwright tests failed. Review the uploaded reports and failure artifacts."
          exit 1
