
name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Choose test suite'
        required: true
        type: choice
        options:
          - sanity
          - regression
          - API
          - web
          - all
        default: all

      browser:
        description: 'Choose browser'
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium

      headed:
        description: 'Run browser in headed mode'
        required: true
        type: boolean
        default: false

  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run selected Playwright tests
        env:
          TEST_TYPE: ${{ inputs.test_type || 'all' }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          HEADED: ${{ inputs.headed }}
        shell: bash
        run: |
          ARGS=()

          case "$TEST_TYPE" in
            sanity)
              ARGS+=(--grep "@sanity")
              ;;
            regression)
              ARGS+=(--grep "@regression")
              ;;
            API)
              ARGS+=(--grep "@API")
              ;;
            web)
              ARGS+=(--grep "@web")
              ;;
            all)
              ;;
            *)
              echo "Invalid test type: $TEST_TYPE"
              exit 1
              ;;
          esac

          # API tests may not require a browser project.
          if [[ "$TEST_TYPE" != "API" ]]; then
            ARGS+=(--project="$BROWSER")
            if [[ "$HEADED" == "true" ]]; then
              ARGS+=(--headed)
            fi
          fi

          npx playwright test "${ARGS[@]}"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore
